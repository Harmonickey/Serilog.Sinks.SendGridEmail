name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'   # e.g. v1.2.0    

jobs:
  build-and-publish:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Serilog.Sinks.SendGridEmail.csproj

      - name: Build
        run: dotnet build Serilog.Sinks.SendGridEmail.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack Serilog.Sinks.SendGridEmail.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o ./nupkg
    
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
    
      # Push the package
      - name: NuGet push
        run: dotnet nuget push artifacts/my-sdk.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json